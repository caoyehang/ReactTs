<!-- 声明 HTML5 文档类型。 -->
<!doctype html>
<!-- 设置页面默认语言。 -->
<html lang="en">
  <!-- 定义页面元信息。 -->
  <head>
    <!-- 设置文档字符集为 UTF-8。 -->
    <meta charset="UTF-8" />
    <!-- 设置浏览器标签页图标。 -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- 设置移动端视口。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 设置默认页面标题，运行时会被路由标题覆盖。 -->
    <title>ReactTs Admin</title>
  </head>
  <!-- 定义页面主体。 -->
  <body>
    <!-- React 应用挂载节点。 -->
    <div id="root"></div>
    <!-- Vite 应用入口脚本。 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
